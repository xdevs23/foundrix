[package]
name = "hypr-workspaced"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Daemon for managing synchronized virtual workspaces across multiple Hyprland monitors"
license = "GPL-3.0-only"

[dependencies]
hyproxide = { path = "../hyproxide" }
tokio = { version = "=1.54.1", features = ["full"] }
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sd-notify = "=0.5.0"
zbus = { version = "=6.2.1", features = ["tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
hyproxide-testing = { path = "../hyproxide/testing" }
serde_json = "=1.0.154"

# Starts Hyprland on the display of the machine, so only the NixOS VM check
# hypr-workspaced-end-to-end runs it.
[[test]]
name = "end_to_end"
test = false

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_results = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
exit = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
strip = true
panic = "abort"
