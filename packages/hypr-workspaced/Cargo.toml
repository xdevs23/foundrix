[package]
name = "hypr-workspaced"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Daemon for managing synchronized virtual workspaces across multiple Hyprland monitors"
license = "GPL-3.0-only"

[dependencies]
hyproxide = { path = "../hyproxide" }
tokio = { version = "1.49", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sd-notify = "0.4"
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
hyproxide-testing = { path = "../hyproxide/testing" }
serde_json = "=1.0.154"

[profile.release]
lto = true
strip = true
panic = "abort"
