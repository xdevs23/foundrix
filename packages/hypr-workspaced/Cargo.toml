[package]
name = "hypr-workspaced"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Daemon for managing synchronized virtual workspaces across multiple Hyprland monitors"
license = "GPL-3.0-only"

[dependencies]
hyproxide = { path = "../hyproxide" }
tokio = { version = "=1.54.1", features = ["full"] }
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sd-notify = "=0.5.0"
zbus = { version = "=6.2.1", features = ["tokio"] }

[dev-dependencies]
hyproxide-testing = { path = "../hyproxide/testing" }
serde_json = "=1.0.154"

[profile.release]
lto = true
strip = true
panic = "abort"
