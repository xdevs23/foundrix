[package]
name = "flasher-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "TUI for selecting a target disk and flashing a system image"
license = "GPL-3.0-only"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"
zstd = "0.13"

[profile.release]
lto = true
strip = true
panic = "abort"
