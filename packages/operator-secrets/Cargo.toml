[package]
name = "operator-secrets"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "operator-secretsd"
path = "src/bin/daemon.rs"

[[bin]]
name = "operator-secrets-tui"
path = "src/bin/tui.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = [
  "rt",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "process",
  "fs",
] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"

# No panic = "abort": the TUI relies on unwinding so its terminal-state
# guard (raw mode / alternate screen) runs even on a panic — a console or
# SSH session must never be left in raw mode without a usable shell.
[profile.release]
lto = true
strip = true
