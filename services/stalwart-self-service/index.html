<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Account</title>
<style>
  :root {
    --bg: #f0f1f3;
    --surface: #ffffff;
    --surface-alt: #f7f8fa;
    --border: #e2e4e9;
    --border-focus: #9ba3b0;
    --text: #1a1d24;
    --text-secondary: #5f6980;
    --text-muted: #8b93a7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-subtle: #eff4ff;
    --danger: #e5484d;
    --danger-hover: #cd2b31;
    --danger-subtle: #fff0f0;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --success-text: #15803d;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 520px;
    width: 100%;
    padding: 1.25rem;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    margin-bottom: 1.5rem;
    animation: fadeSlideIn 0.4s ease both;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }

  .header-text { min-width: 0; }

  .header-name {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-email {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeSlideIn 0.4s ease 0.08s both;
  }

  .card-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
  }

  .card-body { padding: 1.25rem 1.5rem; }

  /* Password list */
  .password-list { list-style: none; }

  .password-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.25s ease both;
  }

  .password-item:last-child { border-bottom: none; }

  .password-info { display: flex; align-items: center; gap: 0.625rem; min-width: 0; }

  .password-icon {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .password-icon svg { width: 14px; height: 14px; color: var(--text-secondary); }

  .password-name {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-state {
    text-align: center;
    padding: 1.5rem 0;
  }

  .empty-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 0.75rem;
    border-radius: 50%;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-icon svg { width: 18px; height: 18px; color: var(--text-muted); }

  .empty-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.2rem;
  }

  .empty-desc {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* Create form */
  .create-form {
    display: flex;
    gap: 0.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    margin-top: 0.25rem;
  }

  .create-form.first { border-top: none; margin-top: 0; padding-top: 0; }

  /* Admin-only address section */
  .subsection-title {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    font-weight: 700;
  }

  .address-tag {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    flex-shrink: 0;
  }

  /* Admin: account picker in the card header */
  #account-select {
    margin-left: auto;
    margin-right: 0.5rem;
    max-width: 15rem;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.78rem;
    outline: none;
  }

  #account-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }

  input[type="text"] {
    flex: 1;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.825rem;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    min-width: 0;
  }

  input[type="text"]::placeholder { color: var(--text-muted); }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }

  /* Buttons */
  button {
    cursor: pointer;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-weight: 600;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    white-space: nowrap;
  }

  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 0.55rem 1rem;
    font-size: 0.825rem;
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-danger-ghost {
    background: transparent;
    color: var(--danger);
    padding: 0.3rem 0.55rem;
    font-size: 0.725rem;
    border: 1px solid transparent;
  }

  .btn-danger-ghost:hover {
    background: var(--danger-subtle);
    border-color: var(--danger);
  }

  .btn-copy {
    background: var(--surface-alt);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 0.3rem 0.55rem;
    font-size: 0.725rem;
  }

  .btn-copy:hover { background: var(--border); }
  .btn-copy.copied { color: var(--success-text); border-color: var(--success-border); background: var(--success-bg); }

  /* Generated password reveal */
  .generated {
    margin-top: 1rem;
    padding: 1rem;
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    border-radius: var(--radius-sm);
    animation: fadeSlideIn 0.3s ease both;
  }

  .generated-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--success-text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
  }

  .generated-value {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: #fff;
    border: 1px solid var(--success-border);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.5rem;
  }

  .generated-value code {
    flex: 1;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    word-break: break-all;
    user-select: all;
    color: var(--text);
  }

  .generated-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* Status */
  #status {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .error { color: var(--danger); }

  /* Loading */
  .loading {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 0.75rem;
  }

  /* Animations */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header" id="header" style="display:none"></div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">App Passwords</span>
      <select id="account-select" style="display:none"></select>
      <span class="badge" id="count"></span>
    </div>
    <div class="card-body">
      <div id="app" class="loading">
        <div class="spinner"></div>
        Loading&hellip;
      </div>
    </div>
  </div>
</div>
<script>
(async () => {
  const app = document.getElementById("app");
  const header = document.getElementById("header");
  const countBadge = document.getElementById("count");
  // Bump when the requested scopes change. A stored token from an older
  // version lacks the new scopes, and the roles claim being absent is
  // indistinguishable from "this user has no roles" — so the admin section
  // would silently never appear. Changing the key discards those sessions
  // and re-runs the OIDC flow once.
  const SESSION_KEY = "mail_account_oidc_v2";

  const KEY_ICON = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"/></svg>`;
  const SHIELD_ICON = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>`;
  const AT_ICON = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm0 0c0 1.657 1.007 3 2.25 3S21 13.657 21 12a9 9 0 1 0-2.636 6.364"/></svg>`;

  // --- Config ---
  let config;
  try {
    const resp = await fetch("/self-service-config.json");
    config = await resp.json();
  } catch {
    app.innerHTML = '<p class="error">Failed to load configuration.</p>';
    return;
  }

  // --- OIDC helpers ---
  function randomBytes(n) {
    const buf = new Uint8Array(n);
    crypto.getRandomValues(buf);
    return buf;
  }

  function base64url(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function sha256(str) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  }

  function generatePassword() {
    const charset = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ123456789";
    const limit = 256 - (256 % charset.length);
    const chars = [];
    while (chars.length < 24) {
      for (const b of randomBytes(32)) {
        if (b < limit) chars.push(charset[b % charset.length]);
        if (chars.length === 24) break;
      }
    }
    const ts = String(Date.now()).slice(-2);
    return chars.join("") + ts;
  }

  function initials(name) {
    if (!name) return "?";
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    return parts[0][0].toUpperCase();
  }

  function escapeHtml(s) {
    const el = document.createElement("span");
    el.textContent = s;
    return el.innerHTML;
  }

  // --- OIDC discovery ---
  const discovery = await fetch(`${config.issuer}/.well-known/openid-configuration`).then(r => r.json());

  // --- Check for callback ---
  const params = new URLSearchParams(location.search);
  if (params.has("code") && params.has("state")) {
    const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    if (saved && saved.state === params.get("state")) {
      const body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: config.clientId,
        code: params.get("code"),
        redirect_uri: `${location.origin}${location.pathname}`,
        code_verifier: saved.codeVerifier,
      });
      const tokenResp = await fetch(discovery.token_endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (tokenResp.ok) {
        const tokens = await tokenResp.json();
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ accessToken: tokens.access_token }));
      }
    }
    history.replaceState(null, "", location.pathname);
  }

  // --- Get token or start OIDC flow ---
  function getToken() {
    const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    return saved?.accessToken || null;
  }

  async function startOIDCFlow() {
    const codeVerifier = base64url(randomBytes(32));
    const codeChallenge = base64url(await sha256(codeVerifier));
    const state = base64url(randomBytes(16));

    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ state, codeVerifier }));

    const authUrl = new URL(discovery.authorization_endpoint);
    authUrl.searchParams.set("client_id", config.clientId);
    authUrl.searchParams.set("redirect_uri", `${location.origin}${location.pathname}`);
    authUrl.searchParams.set("response_type", "code");
    // The two urn: scopes are what make the admin section possible. Neither
    // grants anything on its own — Zitadel still enforces the signed-in
    // user's own permissions — so an ordinary user's token gains no power
    // from holding them:
    //   ...project:roles   surfaces the mail-admin role, gating the section
    //   ...zitadel:aud     makes the token usable against Zitadel's own API,
    //                      which is how the user search and the token
    //                      exchange are performed
    authUrl.searchParams.set(
      "scope",
      "openid email profile urn:zitadel:iam:org:project:roles urn:zitadel:iam:org:project:id:zitadel:aud",
    );
    authUrl.searchParams.set("code_challenge", codeChallenge);
    authUrl.searchParams.set("code_challenge_method", "S256");
    authUrl.searchParams.set("state", state);
    location.href = authUrl;
  }

  let token = getToken();
  if (!token) {
    await startOIDCFlow();
    return;
  }

  // --- Fetch user info ---
  let userInfo = null;
  try {
    const resp = await fetch(discovery.userinfo_endpoint, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (resp.ok) userInfo = await resp.json();
  } catch {}

  // Rendered from claims so it can show either the signed-in user or, for an
  // admin who has picked another account, whichever account the view is
  // currently scoped to.
  function showHeader(claims) {
    if (!claims) return;
    const displayName = claims.name || claims.preferred_username || claims.email || "User";
    // The login name, not the address: this is what a mail client must use.
    const subtitle = claims.preferred_username || claims.email || "";
    header.innerHTML = `
      <div class="avatar">${initials(displayName)}</div>
      <div class="header-text">
        <div class="header-name">${escapeHtml(displayName)}</div>
        ${subtitle ? `<div class="header-email">${escapeHtml(subtitle)}</div>` : ""}
      </div>
    `;
    header.style.display = "";
  }

  showHeader(userInfo);

  // The token every Stalwart call below is made with. Swapped for an
  // impersonated one when an admin scopes the view to another account.
  let activeToken = token;
  let activeUser = null;

  // --- Admin detection ---
  // Zitadel returns project roles as a map keyed by role, each value mapping
  // org id → domain. Presence of the key is the grant; the value only says
  // which orgs it was granted in.
  const roleClaim = userInfo?.["urn:zitadel:iam:org:project:roles"] || {};
  // Both must hold: the role, and the deployment having opted in. Showing the
  // section without the opt-in would offer a button whose token exchange the
  // instance is configured to refuse.
  const isAdmin = Boolean(
    config.adminProvisioning && config.adminRole && roleClaim[config.adminRole],
  );

  // --- Stalwart API ---
  //
  // A 401 does not always mean a stale session: it also means the mail server
  // refused this identity, which signing in again cannot fix. Re-authenticating
  // on every 401 turns that into an endless reload which also destroys the
  // error before it can be read — so it is attempted at most once per browser
  // session, and a second failure is reported instead.
  const REAUTH_KEY = "mail_account_reauth_attempted";

  async function handleUnauthorized() {
    // A failure while acting as someone else says nothing about the operator's
    // own session; clearing it would sign them out over another account's
    // problem.
    if (activeUser) {
      throw new Error(
        `The mail server rejected ${activeUser.loginName}. Its address comes from the login name, ` +
          `so check that the account has one at a domain this server accepts.`,
      );
    }

    if (sessionStorage.getItem(REAUTH_KEY)) {
      sessionStorage.removeItem(REAUTH_KEY);
      throw new Error(
        "The mail server rejected this account after a fresh sign-in, so the session is not the problem.",
      );
    }

    sessionStorage.setItem(REAUTH_KEY, "1");
    sessionStorage.removeItem(SESSION_KEY);
    await startOIDCFlow();
  }

  async function apiGet() {
    const resp = await fetch("/api/account/auth", {
      headers: { Authorization: `Bearer ${activeToken}` },
    });
    if (resp.status === 401) {
      await handleUnauthorized();
      return null;
    }
    if (!resp.ok) throw new Error(`API error: ${resp.status}`);
    // Reaching the API proves the session is sound, so a later 401 gets its
    // own single re-auth attempt rather than inheriting a spent one.
    sessionStorage.removeItem(REAUTH_KEY);
    const json = await resp.json();
    return json.data;
  }

  async function apiPost(requests) {
    const resp = await fetch("/api/account/auth", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${activeToken}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(requests),
    });
    if (resp.status === 401) {
      await handleUnauthorized();
      return;
    }
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(text || `API error: ${resp.status}`);
    }
  }

  // --- Addresses (admins only) ---
  //
  // Addresses are principal data, which no user-level token may edit — the
  // admin web UI is not an option either, since saving a principal there
  // deletes the account's app passwords. The privileged endpoint behind this
  // holds the credential and re-checks the operator's role server-side, so
  // calls carry the operator's own token: an impersonated one has no role
  // and would be refused.
  function activeLoginName() {
    return activeUser ? activeUser.loginName : (userInfo?.preferred_username || "");
  }

  async function aliasRequest(method, body) {
    const account = activeLoginName();
    const url = "/self-service/api/aliases"
      + (method === "GET" ? `?account=${encodeURIComponent(account)}` : "");
    const resp = await fetch(url, {
      method,
      headers: {
        Authorization: `Bearer ${token}`,
        ...(body ? { "Content-Type": "application/json" } : {}),
      },
      body: body ? JSON.stringify({ account, ...body }) : undefined,
    });
    const json = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(json.error || `API error: ${resp.status}`);
    return json;
  }

  // --- UI ---
  let generatedPassword = null;

  async function render() {
    let data;
    try {
      data = await apiGet();
      if (!data) return;
    } catch (e) {
      app.innerHTML = `<p class="error">${escapeHtml(e.message)}</p>`;
      return;
    }

    const passwords = data.appPasswords || [];
    countBadge.textContent = passwords.length === 0 ? "none" : passwords.length;

    const isEmpty = passwords.length === 0;

    let aliasData = null;
    let aliasError = null;
    if (isAdmin) {
      try {
        aliasData = await aliasRequest("GET");
      } catch (e) {
        aliasError = e.message;
      }
    }

    const aliasSection = !isAdmin ? "" : `
      <div class="subsection-title">Addresses</div>
      ${aliasError ? `<p class="error">${escapeHtml(aliasError)}</p>` : `
        <ul class="password-list">
          ${aliasData.emails.map(addr => {
            const isLogin = addr.toLowerCase() === (aliasData.name || "").toLowerCase();
            return `
              <li class="password-item">
                <div class="password-info">
                  <div class="password-icon">${AT_ICON}</div>
                  <span class="password-name">${escapeHtml(addr)}</span>
                  ${isLogin ? `<span class="address-tag">login</span>` : ""}
                </div>
                ${isLogin ? "" : `<button class="btn-danger-ghost" data-alias-remove="${escapeHtml(addr)}">Remove</button>`}
              </li>`;
          }).join("")}
        </ul>
        <div class="create-form">
          <input id="alias-value" type="text" placeholder="alias@domain — use @domain for catch-all" maxlength="254">
          <button class="btn-primary" id="btn-alias-add">Add</button>
        </div>
        <div id="alias-status"></div>
      `}
    `;

    app.innerHTML = `
      ${isEmpty ? `
        <div class="empty-state">
          <div class="empty-icon">${SHIELD_ICON}</div>
          <div class="empty-title">No app passwords</div>
          <div class="empty-desc">Create an app password to use with email clients like Thunderbird or Apple Mail.</div>
        </div>` : `
        <ul class="password-list">
          ${passwords.map(name => `
            <li class="password-item">
              <div class="password-info">
                <div class="password-icon">${KEY_ICON}</div>
                <span class="password-name">${escapeHtml(name)}</span>
              </div>
              <button class="btn-danger-ghost" data-revoke="${escapeHtml(name)}">Revoke</button>
            </li>`).join("")}
        </ul>`}
      <div class="create-form${isEmpty ? " first" : ""}">
        <input id="pw-name" type="text" placeholder="Name (e.g. Thunderbird)" maxlength="50">
        <button class="btn-primary" id="btn-create">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Create
        </button>
      </div>
      ${generatedPassword ? `
        <div class="generated">
          <div class="generated-label">New app password</div>
          <div class="generated-value">
            <code>${generatedPassword}</code>
            <button class="btn-copy" id="btn-copy">Copy</button>
          </div>
          <div class="generated-hint">Copy this now — it won't be shown again.</div>
        </div>` : ""}
      <div id="status"></div>
      ${aliasSection}
    `;

    // Bind events
    document.getElementById("btn-create").addEventListener("click", async () => {
      const nameInput = document.getElementById("pw-name");
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }

      const status = document.getElementById("status");
      const password = generatePassword();

      try {
        status.textContent = "Creating\u2026";
        await apiPost([{ type: "addAppPassword", name, password }]);
        generatedPassword = password;
        await render();
      } catch (e) {
        status.innerHTML = `<span class="error">${escapeHtml(e.message)}</span>`;
      }
    });

    const copyBtn = document.getElementById("btn-copy");
    if (copyBtn) {
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(generatedPassword);
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("copied"); }, 2000);
        } catch {
          copyBtn.textContent = "Failed";
        }
      });
    }

    document.querySelectorAll("[data-revoke]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const name = btn.dataset.revoke;
        if (!confirm(`Revoke app password "${name}"?`)) return;

        try {
          await apiPost([{ type: "removeAppPassword", name: name + "$" }]);
          generatedPassword = null;
          await render();
        } catch (e) {
          document.getElementById("status").innerHTML = `<span class="error">${escapeHtml(e.message)}</span>`;
        }
      });
    });

    const aliasAdd = document.getElementById("btn-alias-add");
    if (aliasAdd) {
      aliasAdd.addEventListener("click", async () => {
        const input = document.getElementById("alias-value");
        const value = input.value.trim();
        if (!value) { input.focus(); return; }

        const status = document.getElementById("alias-status");
        try {
          status.textContent = "Adding…";
          await aliasRequest("POST", { add: value });
          await render();
        } catch (e) {
          status.innerHTML = `<span class="error">${escapeHtml(e.message)}</span>`;
        }
      });
    }

    document.querySelectorAll("[data-alias-remove]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const address = btn.dataset.aliasRemove;
        if (!confirm(`Remove address "${address}"?`)) return;

        try {
          await aliasRequest("POST", { remove: address });
          await render();
        } catch (e) {
          document.getElementById("alias-status").innerHTML = `<span class="error">${escapeHtml(e.message)}</span>`;
        }
      });
    });
  }

  // --- Admin: acting on another account ---
  //
  // Not a separate UI: an admin picks an account and the same view below is
  // re-scoped to it. Everything already works in terms of `activeToken`, so
  // switching account is just switching that token — an impersonated one
  // stands in for the signed-in user's own.
  //
  // Impersonating is also the account's first authentication, which is what
  // brings its Stalwart principal into existence; a mailbox that has never
  // signed in does not exist until this happens.

  async function zitadelPost(path, body, orgId) {
    const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
    // The management API acts on the token's own org unless told otherwise,
    // so without this header only half the users are ever visible.
    if (orgId) headers["x-zitadel-orgid"] = orgId;
    const resp = await fetch(`${config.issuer}${path}`, {
      method: "POST", headers, body: JSON.stringify(body || {}),
    });
    if (!resp.ok) {
      throw new Error(`${path} → ${resp.status} ${await resp.text().catch(() => "")}`);
    }
    return resp.json();
  }

  async function loadUsers() {
    const orgsResp = await zitadelPost("/admin/v1/orgs/_search", { query: { limit: 100 } });
    const wanted = config.orgDomains || [];
    const orgs = (orgsResp.result || [])
      .map(o => ({ id: o.id, domain: o.primaryDomain || o.name }))
      .filter(o => wanted.length === 0 || wanted.includes(o.domain));

    const perOrg = await Promise.all(orgs.map(async (org) => {
      const resp = await zitadelPost("/management/v1/users/_search", { query: { limit: 100 } }, org.id);
      // Machine users are offered too: the mailbox address comes from the
      // login name, not from the email claim they lack.
      return (resp.result || [])
        .map(u => ({
          id: u.id,
          loginName: u.preferredLoginName || u.userName || "",
          displayName: u.human?.profile?.displayName
            || u.machine?.name
            || u.userName || "",
        }));
    }));

    return perOrg.flat().sort((a, b) => a.loginName.localeCompare(b.loginName));
  }

  async function impersonate(userId) {
    const resp = await fetch(discovery.token_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
        client_id: config.clientId,
        subject_token: userId,
        subject_token_type: "urn:zitadel:params:oauth:token-type:user_id",
        actor_token: token,
        actor_token_type: "urn:ietf:params:oauth:token-type:access_token",
        scope: "openid email profile",
      }),
    });
    const json = await resp.json().catch(() => ({}));
    if (!resp.ok || !json.access_token) {
      throw new Error(json.error_description || json.error || `Token exchange failed (${resp.status})`);
    }
    return json.access_token;
  }

  // Whose account the view is showing. Null means the signed-in user, and the
  // header reverts to their own details.
  async function selectAccount(user) {
    generatedPassword = null;

    if (!user) {
      activeToken = token;
      activeUser = null;
      showHeader(userInfo);
      await render();
      return;
    }

    activeToken = await impersonate(user.id);
    activeUser = user;

    // Show the account being acted on, and specifically the name a mail
    // client must log in with — assuming the address costs a failed login.
    let claims = null;
    try {
      const resp = await fetch(discovery.userinfo_endpoint, {
        headers: { Authorization: `Bearer ${activeToken}` },
      });
      if (resp.ok) claims = await resp.json();
    } catch {}
    showHeader(claims || { name: user.displayName, preferred_username: user.loginName });

    await render();
  }

  if (isAdmin) {
    const select = document.getElementById("account-select");
    select.style.display = "";
    select.innerHTML = `<option value="">Loading accounts…</option>`;

    try {
      const users = await loadUsers();
      select.innerHTML = `<option value="">${escapeHtml(userInfo?.preferred_username || "My account")}</option>`
        + users.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(u.loginName)}</option>`).join("");

      select.addEventListener("change", async () => {
        const user = users.find(u => u.id === select.value) || null;
        app.innerHTML = `<div class="loading"><div class="spinner"></div>Loading…</div>`;
        try {
          await selectAccount(user);
        } catch (e) {
          app.innerHTML = `<p class="error">${escapeHtml(e.message)}</p>`;
        }
      });
    } catch (e) {
      select.innerHTML = `<option value="">Accounts unavailable</option>`;
      console.error("Could not load accounts:", e);
    }
  }

  await render();
})();
</script>
</body>
</html>
